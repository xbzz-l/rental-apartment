# 单容器托管一端的静态资源，并把 /api、/images 反代到后端容器
# 后端地址来自 docker-compose 的服务名：server:8080

upstream rental_backend {
    server server:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # 接口反向代理：外网只与本容器通信，后端不对外暴露
    location /api/ {
        proxy_pass http://rental_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 房源图片（后端 static 目录，数据库里存的是相对路径 /images/...）
    location /images/ {
        proxy_pass http://rental_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 接口文档，便于部署后排查（不需要可整段删掉）
    location ~ ^/(doc\.html|webjars/|v3/api-docs|swagger-resources) {
        proxy_pass http://rental_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 带 hash 的打包产物，可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
